   x=Math.max(left+size*.56,Math.min(left+width-size*.56,x+(dx+o.jitter)*factor));
   y=Math.max(top+size*.56,Math.min(dockTop-size*.55,y+dy*factor));
   return {o,i,x,y,size};
 }).sort((a,b)=>a.y-b.y);
 items.innerHTML=layers.map(({o,i,x,y,size})=>'<g transform="translate('+x+' '+y+') rotate('+o.rot+') scale('+size/54+')"><g class="obj" style="display:'+(o.done?'none':'inline')+'" data-i="'+i+'" role="button" tabindex="0" aria-label="'+names[o.t]+'"><use href="#v'+o.t+'-'+o.v+'" pointer-events="none"/><path d="'+outlines[o.t][o.v]+'" fill="transparent" stroke="none"/></g></g>').join('');
}
function pick(e){let el=e.target.closest('.obj');if(!el)return;let o=objs[+el.dataset.i];if(o.done)return;
 if(!active.includes(o.t)&&e.detail>0){
   const under=document.elementsFromPoint(e.clientX,e.clientY).map(node=>node.closest('.obj')).find(node=>node&&active.includes(objs[node.dataset.i].t));
   if(under){el=under;o=objs[under.dataset.i]}
 }
 if(!active.includes(o.t)){notify('先收纳箱子对应的物品');return}let r=el.getBoundingClientRect(),b=document.getElementById('bin'+o.t).getBoundingClientRect();let fly=document.createElementNS(S.namespaceURI,'svg');fly.setAttribute('viewBox','-27 -27 54 54');fly.innerHTML='<use href="#v'+o.t+'-'+o.v+'" stroke="#66503d"/>';fly.style.cssText='position:fixed;pointer-events:none;z-index:5;width:38px;left:'+r.x+'px;top:'+r.y+'px';document.body.append(fly);fly.animate([{transform:'translate(0,0)'},{transform:'translate('+(b.x+b.width/2-r.x)+'px,'+(b.y+15-r.y)+'px) scale(.35)',opacity:.25}],{duration:440,easing:'ease-in'}).onfinish=()=>fly.remove();o.done=true;el.style.display='none';collectSound(o.t);draw();
 if(objs.every(v=>v.t!==o.t||v.done)){
   const arrived=pause(440);
   packingQueue=packingQueue.then(()=>arrived).then(()=>packCategory(o.t));
 }
}

 const game=document.querySelector('main');
 game.inert=true;

     [659,784,1047].forEach((pitch,i)=>note(fxBus,pitch,.24,.055,'triangle',i*.10));
   }

       settlement.classList.remove('leaving');

     },350);
   },2600);
 },500);
}
